[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tegg-esa-report"
version = "0.1.0"
description = "Automates the TEGG ESA customer report build"
requires-python = ">=3.10"
dependencies = [
    "pypdf>=6.0",
    "python-docx>=1.1",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
# reportlab draws the DRAFT watermark, which is part of the safety story rather
# than a test fixture, so it belongs in the runtime extra.
portal = ["playwright>=1.40", "reportlab>=4.0"]

[project.scripts]
# The portal operations a coworker runs. `python -m awe_tegg ...` is the same
# thing and still works; this exists so nobody has to know that.
awe-tegg = "awe_tegg.cli:main"
# The older manual-download pipeline.
tegg = "tegg.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
