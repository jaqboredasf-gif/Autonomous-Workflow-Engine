[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tegg-esa-report"
version = "0.1.0"
description = "Automates the TEGG ESA customer report build"
requires-python = ">=3.10"
dependencies = [
    "pypdf>=6.0",
    "python-docx>=1.1",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "reportlab>=4.0"]
portal = ["playwright>=1.40"]

[project.scripts]
tegg = "tegg.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
