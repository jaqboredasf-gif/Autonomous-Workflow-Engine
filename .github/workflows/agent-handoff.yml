name: Agent handoff validation

on:
  pull_request:
    paths:
      - "AGENTS.md"
      - "docs/planning/AGENT_HANDOFF.md"
      - "scripts/validate-agent-handoff.sh"
      - ".github/workflows/agent-handoff.yml"
  push:
    paths:
      - "AGENTS.md"
      - "docs/planning/AGENT_HANDOFF.md"
      - "scripts/validate-agent-handoff.sh"
      - ".github/workflows/agent-handoff.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Validate agent handoff
        run: bash scripts/validate-agent-handoff.sh
