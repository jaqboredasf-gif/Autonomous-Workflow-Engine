# TEGG ESA Report workflow definition.
#
# This file is the machine-readable form of the manual SOP in docs/SOP.md.
# Changing the report set, the parameters, or the assembly order should be a
# change to THIS file -- not to Python code.

portal:
  base_url: "https://tegg2.teggpro.com"
  login_path: "/auth/login"
  dashboard_path: "/sales/gm-dashboard"
  contractor: "Lippolis"
  # Credentials are NEVER stored here. They are read from the environment:
  #   TEGG_USERNAME / TEGG_PASSWORD
  # See docs/GAPS.md -> "Credential handling".
  #
  # Controls are located by these labels. If the live site words one
  # differently, change it here -- no code change needed.
  # Captured from the live sign-in page on 2026-07-29 with
  # `tegg portal probe-login` (which needs no credentials). These are HINTS,
  # not requirements: the form is located by structure -- the password field is
  # the anchor -- so a wording change here does not break sign-in.
  #
  # What the live page actually shows:
  #   username  <input type="email" name="email">
  #             label "Please enter email address/username"
  #   password  <input type="password" name="password">
  #             label "Enter your password"
  #   submit    button "Sign in"
  #   contractor  a custom <contractorconnection> control, not a <select>
  login_labels:
    contractor: "Contractor"
    username: "email"
    password: "password"
    submit: "Sign in"

  # --- the site-visit route -------------------------------------------------
  # The company-level Reports screen reports "currently no agreements", so it
  # is NOT the way in. The route that works is the one a human uses:
  #   Documentation -> a completed site visit -> Document Library -> Certificates
  #
  # Each of these is a list of labels to try, in order. A wording difference on
  # the real site is a change here, not a code change. Set documentation_path
  # instead if you know the direct URL.
  # Sign-in happens client-side (Angular), so there is no page navigation to
  # wait on. The driver polls for the form to disappear, the route to change,
  # or an error message -- up to this long.
  login_timeout_ms: 30000

  # Any further values this portal demands beyond username and password, e.g.
  # a company code. Keys are matched against a control's name, id or label.
  # Use "env:VAR_NAME" for anything secret so it stays out of this file.
  #   extra_fields:
  #     companyCode: "ACME-1"
  #     pin: "env:TEGG_PIN"
  extra_fields: {}

  # Confirmed live 2026-07-29. The visit table is filled by a later API call,
  # so the driver waits for it rather than reading the page at load.
  documentation_path: "/sales/documentation"
  documentation_labels: ["Documentation", "Documents", "Site Visits"]
  # The list defaults to "Recent"; widen it so older completed visits appear.
  visit_timeframe: "All Site Visits"
  max_list_pages: 20
  document_library_labels: ["Document Library", "Documents", "Library"]
  certificate_labels: ["Certificates", "Certificate", "Certificates good"]
  # Extra links to follow inside a site visit while hunting for the reports.
  # Populate this from what `tegg portal inspect` reports.
  report_routes: []
  timeout_ms: 30000

# The shared "Print Report -> choose format -> Export" flow.
export:
  print_button: "Print Report"
  format_label: "Select a Format"
  format_value: "Acrobat PDF file"
  export_button: "Export"

# Folder layout on the TEGG T shared drive.
destination:
  root: "z. TEGG Job Folders (Reports Only)"
  # Rendered as <root>/<company>/<site>/<year>
  levels: ["company", "site", "year"]

# ---------------------------------------------------------------------------
# The real report route, confirmed live on 2026-07-29.
# ---------------------------------------------------------------------------
# The company-level /reports page is a dead end ("currently no agreements").
# The working route is inside Documentation, and a site MUST be selected first
# or every tab shows "PLEASE SEARCH FOR A CUSTOMER OR SITE USING THE SEARCH BAR":
#
#   1. /sales/documentation
#   2. Type the SITE name into the search box (placeholder "Enter customer or
#      site name"). It is an ngx-bootstrap typeahead: results render into
#      <typeahead-container> as .dropdown-item, grouped Customers / Sites.
#      Keystrokes must be real -- fill() does not trigger it, use typing.
#   3. Click the "Reports" tab, then the "Standard ESA Reports" category.
#   4. Click the report, set Agreement (and Site Visit / Order By / Images
#      where offered), then "Print Report" -> choose format -> Export.
#
# Certificates come from the "Document Library" tab in the same site context.
#
# Individual site-visit rows SSO out to remote.teggpro.com ("TEGGPro Remote"),
# which is per-asset field data -- equipment, problems, images. The ESA reports
# are NOT there.
esa_reports:
  documentation_path: "/sales/documentation"
  search_placeholder: "customer or site"
  typeahead_item: "typeahead-container .dropdown-item"
  reports_tab: "Reports"
  category: "Standard ESA Reports"
  # Confirmed labels. Two are sub-options under "Equipment Inventory".
  routes:
    problem_count_summary: ["Problem Count Summary"]
    standard_ir: ["Standard IR Report"]
    eds_all_problems: ["EDS Component Problem Summary"]
    equipment_item_problems: ["Equipment Item Problems"]
    equipment_inventory_short: ["Equipment Inventory", "Short Form"]
    equipment_inventory_long: ["Equipment Inventory", "Long Form"]
  certificate_tab: "Document Library"

# ---------------------------------------------------------------------------
# Stage 1: documents pulled from the TEGG Pro portal.
# ---------------------------------------------------------------------------
# Each entry records where the document lives in the portal UI and which
# dropdowns must be set before exporting. `params` values are resolved against
# the job file (see config/job.example.yaml).

documents:
  - key: certificate
    filename: "Certificates.docx"
    format: docx
    nav: ["Documentation", "Document Library", "Certificates"]
    params:
      solution: "{agreement}"
    action: "Print/Generate Document"

  - key: equipment_inventory_short
    filename: "EquipmentInventoryShortForm.pdf"
    format: pdf
    nav: ["Reports", "Standard ESA Reports", "Equipment Inventory and Short Form"]
    params:
      agreement: "{agreement}"
      site_visit: "{site_visit}"
      order_by: "Locations"
      images: "Include Images"

  - key: equipment_inventory_long
    filename: "EquipmentInventoryLongForm.pdf"
    format: pdf
    nav: ["Reports", "Standard ESA Reports", "Equipment Inventory and Long Form"]
    params:
      agreement: "{agreement}"
      record_selection: "Site Visits"

  - key: equipment_item_problems
    filename: "EquipmentItemProblem_AllImages.pdf"
    format: pdf
    nav: ["Reports", "Standard ESA Reports", "Equipment Item Problems and Include All Images"]
    params:
      contact: "__first_available__"
      agreement: "{agreement}"
      site_visit: "{site_visit}"

  - key: problem_count_summary
    filename: "ProblemCountSummary.pdf"
    format: pdf
    nav: ["Reports", "Standard ESA Reports", "Problem Count Summary"]
    params:
      contact: "__first_available__"
      agreement: "{agreement}"
      site_visit: "{site_visit}"

  - key: standard_ir
    filename: "StandardIRReport.pdf"
    format: pdf
    nav: ["Reports", "Standard ESA Reports", "Standard IR Report"]
    params:
      contact: "__first_available__"
      agreement: "{agreement}"
      site_visit: "{site_visit}"

  - key: eds_all_problems
    filename: "EDSAllProblemsOnly.pdf"
    format: pdf
    nav: ["Reports", "Standard ESA Reports", "EDS Component Problem Summary and All Problems"]
    params:
      contact: "__first_available__"
      agreement: "{agreement}"
      site_visit: "{site_visit}"

# ---------------------------------------------------------------------------
# Stage 2: certificate edits (Certificates.docx -> Certificates good.pdf)
# ---------------------------------------------------------------------------
certificate:
  source: "Certificates.docx"
  output: "Certificates good.pdf"
  # The SOP says "delete first group of checkboxes".
  delete_first_checkbox_group: true
  # Section A gets today's date at run time.
  date_field: "A"
  # Section B answers, straight from the SOP.
  # Keys are *_items rather than yes/no because YAML 1.1 parses bare
  # yes/no as booleans.
  section_b:
    yes_items: [1, 2, 3, 4, 5, 9]
    no_items:  [6, 7, 8, 10]

# ---------------------------------------------------------------------------
# Stage 3: split the Standard IR Report into cover + body
# ---------------------------------------------------------------------------
splits:
  - source: "StandardIRReport.pdf"
    outputs:
      - name: "Cover.pdf"
        pages: "1"
      - name: "StandardIRReport no cover.pdf"
        pages: "2-"

# ---------------------------------------------------------------------------
# Stage 4: final merge order (exact order from the SOP)
# ---------------------------------------------------------------------------
assembly:
  order:
    - "Cover.pdf"
    - "ESA Table of Contents.pdf"
    - "Certificates good.pdf"
    - "ProblemCountSummary.pdf"
    - "EquipmentInventoryShortForm.pdf"
    - "EquipmentInventoryLongForm.pdf"
    - "StandardIRReport no cover.pdf"
    - "EquipmentItemProblem_AllImages.pdf"
    - "EDSAllProblemsOnly.pdf"
    - "TEGGPro View Customer Instructions.pdf"
  # NOTE: the SOP writes the output as “Company Name””Site Name””Year” ESA Report.pdf
  # with no visible separator. Defaulting to spaces -- CONFIRM WITH PAUL.
  output_template: "{company} {site} {year} ESA Report.pdf"

# Documents that are the same on every job and are not pulled from the portal.
static_assets:
  - "ESA Table of Contents.pdf"
  - "TEGGPro View Customer Instructions.pdf"
